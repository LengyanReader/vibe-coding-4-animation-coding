# 全部界面文本(非情景内容)——{key: {zh, en}},缺一即红(i18n 完整性门)
# All chrome text. Keys are namespaced; interpolation uses {token}.
ui:
  app_title: {zh: 一息 · 研究演示器, en: "One Breath · research demonstrator"}
  app_subtitle:
    zh: 四个乐章:遭遇 — 互系 — 放下 — 回应。棋盘是镜子,不是裁判。
    en: "Four movements: Encounter — Interrelate — Release — Respond. The board is a mirror, not a judge."
  choose_language: {zh: 语言 / Language, en: 语言 / Language}
  reduced_motion: {zh: 减弱动效, en: Reduced motion}
  words: {zh: "文字", en: "Words"}
  audio: {zh: 声音, en: Sound}
  "on": {zh: "开", en: "on"}
  "off": {zh: "关", en: "off"}
  begin: {zh: 开始, en: Begin}
  vignettes_title:
    zh: 选择一个情景(每个 2–4 分钟,可随时退出)
    en: Choose a scenario (2–4 minutes each; you may leave at any time)
  movement:
    encounter: {zh: 遭遇, en: Encounter}
    interrelate: {zh: 互系, en: Interrelate}
    release: {zh: 放下, en: Release}
    respond: {zh: 回应, en: Respond}
    ending: {zh: 余象, en: After-image}
  mirror_caption:
    zh: 对照棋局——你的处境,在棋盘上的样子
    en: Mirror board — your situation, as a position
  mirror_hint_attack:
    zh: 他的棋只剩一口气;而你的另一块,也只剩一口气
    en: His chain has one liberty left; so does one of yours
  mirror_hint_calm:
    zh: 没有人的气被点掉——相安
    en: Nobody lost a liberty — coexistence
  mirror_hint_engine:
    zh: "算力提了三子;你的另一块棋薄了一气"
    en: "The engine takes three; your other chain thins by one breath"
  mirror_hint_pass:
    zh: 虚着之后,一切如常
    en: After the pass, everything as it was
  ending_title: {zh: 这一回应保护的是, en: What this response protects}
  ending_all_equal:
    zh: 五种回应并列,没有哪一种更"对"。它们各自保护了不同的东西。
    en: The five responses stand side by side; none is more right. Each protects a different thing.
  reflection:
    zh: "一个不带评分的问题:刚才那一手棋,你在自己的生活里见过吗?"
    en: "One un-scored question: have you seen that board move somewhere in your own life?"
  skip_reflection: {zh: 跳过, en: Skip}
  replay: {zh: 再走一次这个情景, en: Walk this scenario again}
  back_to_list: {zh: 回到情景列表, en: Back to the scenarios}
  afterimage_caption:
    zh: 全盘——每一子都有效率(吴清源,「中的精神」)
    en: The whole board — every stone doing its work (Wu Qingyuan, "the spirit of the middle")
  footer:
    zh: 研究演示器 · 无评分 · 无数据收集 · 无 AI · 内容与棋局全部确定性生成
    en: Research demonstrator · no scoring · no data collection · no AI · all content and positions deterministic

  sit_view:
    zh: 坐观——与终局对坐,视野四重
    en: Sit and contemplate — four widening views of the final position
  view_phenomena:
    zh: "观一 · 事:每颗子有它的位置与来历"
    en: "View 1 · phenomena: every stone has its place and its history"
  view_principle:
    zh: "观二 · 理:每颗子都是同一口气的暂时形状"
    en: "View 2 · principle: every stone is a temporary shape of one breath"
  view_interwork:
    zh: "观三 · 理事无碍:提过的子,也仍在棋局里"
    en: "View 3 · their non-obstruction: the lifted stones are still in the game"
  view_indra:
    zh: "观四 · 事事无碍:每颗子里,映着整盘棋"
    en: "View 4 · Indra's net: in every stone, the whole board is reflected"
  next_view: {zh: "下一观", en: "Next view"}
  prev_view: {zh: "上一观", en: "Previous view"}
  return_board:
    zh: 回到棋盘——夜还长
    en: Back to the board — the night is long
  # Chapter 0 · 学棋 → 照见 → 觉悟人生 (chrome only; lesson text lives in lessons.yaml)
  lesson:
    chapter_label: {zh: 第零章 · 学棋, en: "Chapter 0 · Learning the board"}
    step: {zh: "第 {n}/{total} 手", en: "Move {n} of {total}"}
    core: {zh: 主线, en: Core}
    optional: {zh: 加看, en: Extra}
    continue: {zh: 继续, en: Continue}
    reset: {zh: 重来, en: Reset}
    pass: {zh: 虚着, en: Pass}
    skip: {zh: 跳过教学, en: Skip the lesson}
    board_caption: {zh: 教学棋盘 · 点交叉点落子, en: "Teaching board · click an intersection"}
    msg:
      not_liberty: {zh: 空着、并且挨着这块棋的点,才是它的气。, en: "A liberty is an empty point next to the chain."}
      counted: {zh: "数对了:这块棋有 {n} 口气。", en: "Counted: this chain has {n} liberties."}
      captured: {zh: "提子 {n} 颗。", en: "Captured {n} stones."}
      no_capture: {zh: 这一手没有提子。再看一眼那块棋最后一口气在哪。, en: "No capture this time. Look again at where the chain's last liberty is."}
      refused_reason: {zh: "这一手不能下({reason})。", en: "That move is refused ({reason})."}
      wrong_point: {zh: 换一个点试试。, en: "Try another point."}
      surprisingly_legal: {zh: 这一手居然能下——重来一次,换一个点。, en: "That move was legal — reset and try another point."}
      one_eye: {zh: 填不进去。还有一个眼。, en: "It will not go in. One more eye to try."}
      refused_suicide: {zh: 填不进去:这一点没有自己的气。, en: "It will not go in: the point has no breath of its own."}
      both_eyes: {zh: 两个眼都填不进去:这块棋是活的。, en: "Both eyes refuse the move: this chain is alive."}
      mutual_reply: {zh: "他也点了一口。走廊现在只剩 {n} 口共享的气。", en: "He filled one too. {n} shared breaths remain."}
      mutual_lost: {zh: 数完了:先动手的那块棋,没了。重来,或者虚着。, en: "The count is done: the first mover's chain is gone. Reset, or pass."}
      pass_kept: {zh: 虚着。走廊没有变;两块棋都还在。, en: "A pass. The corridor is unchanged; both chains remain."}
      pass_lost: {zh: 先动手的那块已经没了。重来,再虚着。, en: "The first mover's chain is gone. Reset, then pass."}
      reset: {zh: 回到这一步的开头。, en: "Back to the start of this step."}
      occupied: {zh: 这一点已经有子了。, en: "That point already has a stone."}

  compare:
    title: {zh: "照见 · 同一个形状,两种读法", en: "Mirror · one shape, two readings"}
    find_you: {zh: "先找你自己:哪一块棋,和你一样只有一条走廊?", en: "First find yourself: which chain has only this corridor, like you?"}
    found_you: {zh: 这块。它和你一样,只有一条走廊。, en: "This one. It has only this corridor, like you."}
    find_corridor: {zh: "再找你们共用的气:点一个走廊上的空点。", en: "Now find the breath you share: click an empty point in the corridor."}
    found_corridor: {zh: "这 {n} 口,是你们共用的。谁先填,谁把最后一口留给对方。", en: "These {n} points are shared. Whoever fills first hands over the last breath."}
    try_again: {zh: 再看看。气在空点上,不在子上。, en: "Look again. Breath is on empty points, not on stones."}
    continue: {zh: 看清楚了,继续, en: Seen it — continue}
